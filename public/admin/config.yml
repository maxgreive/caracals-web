backend:
  name: git-gateway
  branch: main

media_folder: src/assets/images
public_folder: /images
site_url: https://caracals.de
locale: de
logo_url: /images/admin-logo.svg

collections:
  - name: team
    label: Team
    folder: src/pages/teams
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: featuredImage, widget: image }
      - label: Introduction
        name: introduction
        widget: object
        fields:
          - { label: Title, name: intro-title, widget: string }
          - { label: Text, name: intro-text, widget: markdown }
      - label: Gallery
        name: gallery
        widget: list
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string }
      - label: Content
        name: main
        widget: object
        fields:
          - label: Title
            name: title
            widget: string
          - label: Text
            name: text
            widget: markdown
  - name: page
    label: Page
    files:
      - label: Training
        file: src/content/pages/training.md
        name: training
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Featured Image, name: featuredImage, widget: image }
          - { label: Intro Video URL, name: introVideoUrl, widget: string }
          - { label: Current Season, name: currentSeason, widget: select, options: ["summer", "winter"] }
          - { label: Status Title, name: statusTitle, widget: string }
          - { label: Important Title, name: importantTitle, widget: string }
          - label: Important Notice
            name: importantNotice
            widget: list
            field: { label: Paragraph, name: paragraph, widget: string }
          - label: Seasons
            name: seasons
            widget: object
            fields:
              - label: Summer
                name: summer
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - label: Intro
                    name: intro
                    widget: list
                    field: { label: Paragraph, name: paragraph, widget: string }
                  - &schedule_blocks
                    label: Schedule Blocks
                    name: scheduleBlocks
                    widget: list
                    fields:
                      - { label: Title, name: title, widget: string }
                      - &sessions
                        label: Sessions
                        name: sessions
                        widget: list
                        fields:
                          - { label: Weekday, name: weekday, widget: select, options: ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"] }
                          - { label: Time, name: time, widget: string }
                          - { label: Location Name, name: locationName, widget: string }
                          - { label: Location URL, name: locationUrl, widget: string }
                          - label: Address Lines
                            name: addressLines
                            widget: list
                            required: false
                            field: { label: Address Line, name: addressLine, widget: string }
              - label: Winter
                name: winter
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Title, name: title, widget: string }
                  - label: Intro
                    name: intro
                    widget: list
                    field: { label: Paragraph, name: paragraph, widget: string }
                  - *schedule_blocks
  - name: content
    label: Content
    files:
    - label: Home
      file: src/content/pages/index.md
      name: index
      fields:
        - { label: Title, name: title, widget: string }
        - { label: Hero Image, name: heroImage, widget: image }
        - { label: Intro, name: intro, widget: markdown }
        - label: Teams
          name: teams
          widget: list
          identifier_field: name
          fields:
            - { label: Title, name: name, widget: string }
            - { label: URL-Handle, name: handle, widget: string }
            - { label: Image, name: image, widget: image }
        - label: About
          name: about
          widget: object
          fields:
            - label: Image
              name: image
              widget: image
            - label: Title
              name: title
              widget: string
            - label: Title
              name: text
              widget: markdown
        - label: Links
          name: links
          widget: list
          identifier_field: label
          fields:
            - { label: Label, name: label, widget: string }
            - { label: URL, name: url, widget: string }
    - label: Footer
      file: src/content/data/footer.md
      name: footer
      fields:
        - label: Instagram Posts
          name: instagram
          widget: list
          fields: [{ label: Title, name: title, widget: string }, { label: Image, name: image, widget: image }, { label: URL, name: url, widget: string }]
